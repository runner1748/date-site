<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Афиша свиданий</title>
<meta name="description" content="Выбери свидание, день и время — и отправь билет.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
/* Layout idea: a night playbill. Left column is the programme (ideas, day, time),
   right column is one loud object — a butter-yellow paper ticket that fills in live. */
:root {
  color-scheme: dark;
  --night: #24101a;        /* page */
  --night-2: #321827;      /* card surface */
  --line: #5a334c;         /* hairlines, idle borders */
  --blush: #f8e6e1;        /* main text */
  --muted: #c7a6b3;        /* secondary text */
  --coral: #ff6b7d;        /* accent: selection, focus */
  --butter: #ffd978;       /* ticket paper */
  --ink: #2a1320;          /* text on ticket */

  --display: "Yeseva One", "Georgia", "Times New Roman", serif;
  --body: "Onest", "Segoe UI", "Helvetica Neue", Arial, sans-serif;

  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.375rem;
  --fs-xl: 2rem;
  --fs-hero: clamp(3.25rem, 13vw, 8.5rem);
  --radius: 14px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--blush);
  font-family: var(--body);
  font-size: var(--fs-md);
  line-height: 1.5;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

.page {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 20px 120px;
  overflow-x: clip; /* the tilted ticket must not widen the page */
}

/* ---------- Hero ---------- */
.hero {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-bottom: 36px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 36px;
}
.brand {
  font-size: var(--fs-sm);
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--butter);
  margin: 0;
}
.hero h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: var(--fs-hero);
  line-height: 0.92;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.hero h1 span { color: var(--coral); }
.hero p {
  max-width: 46ch;
  margin: 6px 0 0;
  font-size: 1.125rem;
  color: var(--muted);
}

/* ---------- Columns ---------- */
.layout {
  display: grid;
  gap: 48px;
}
.programme {
  display: flex;
  flex-direction: column;
  gap: 52px;
  min-width: 0;
}
@media (min-width: 940px) {
  .layout {
    grid-template-columns: minmax(0, 1fr) 370px;
    gap: 56px;
    align-items: start;
  }
  .ticket-col { position: sticky; top: 24px; }
}

/* ---------- Steps ---------- */
.step { display: flex; flex-direction: column; gap: 18px; }
.step-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.step-num {
  font-family: var(--display);
  font-size: var(--fs-xl);
  line-height: 1;
  color: var(--coral);
}
.step-head h2 {
  font-family: var(--display);
  font-weight: 400;
  font-size: var(--fs-xl);
  line-height: 1.1;
  margin: 0;
}
.step-hint {
  margin: 0 0 0 auto;
  font-size: var(--fs-sm);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* chips: filters and times */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 8px 16px;
  font-size: var(--fs-sm);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  transition: background-color .15s, border-color .15s, color .15s;
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] {
  background: var(--blush);
  border-color: var(--blush);
  color: var(--ink);
}

/* idea cards */
.ideas {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 12px;
}
.idea {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
  background: var(--night-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  min-height: 172px;
  transition: transform .15s, border-color .15s, background-color .15s, opacity .15s;
}
.idea:hover { border-color: var(--muted); transform: translateY(-2px); }
.idea-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.idea-title {
  font-family: var(--display);
  font-size: var(--fs-lg);
  line-height: 1.15;
  text-wrap: balance;
}
.idea-text { font-size: var(--fs-sm); color: var(--muted); }
.idea-meta {
  margin-top: auto;
  padding-top: 6px;
  font-size: var(--fs-xs);
  color: var(--blush);
  opacity: .85;
}
.idea[aria-pressed="true"] {
  background: var(--butter);
  border-color: var(--butter);
  color: var(--ink);
}
.idea[aria-pressed="true"] .idea-top,
.idea[aria-pressed="true"] .idea-text,
.idea[aria-pressed="true"] .idea-meta { color: var(--ink); opacity: 1; }
.idea[aria-pressed="true"] .idea-pick::after { content: "выбрано"; font-weight: 700; }
.idea[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }
.idea[aria-disabled="true"]:hover { transform: none; border-color: var(--line); }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ghost {
  border: 1px dashed var(--muted);
  background: transparent;
  border-radius: 999px;
  padding: 9px 18px;
  font-size: var(--fs-sm);
  font-weight: 600;
}
.ghost:hover { border-style: solid; border-color: var(--blush); }

.field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 220px; min-width: 0; }
.field label { font-size: var(--fs-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.field input, .field textarea {
  width: 100%;
  background: var(--night-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
}
.field textarea { resize: vertical; min-height: 68px; }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); opacity: .7; }

/* calendar: 14 days from today */
.days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
}
.day {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: var(--night-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 9px 0 8px;
  transition: background-color .15s, border-color .15s, color .15s;
}
.day:hover { border-color: var(--muted); }
.day-wd { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.day.weekend .day-wd { color: var(--coral); }
.day-n { font-family: var(--display); font-size: var(--fs-lg); line-height: 1.1; font-variant-numeric: tabular-nums; }
.day[aria-pressed="true"] { background: var(--coral); border-color: var(--coral); color: var(--ink); }
.day[aria-pressed="true"] .day-wd { color: var(--ink); }

.time-own { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--muted); }
.time-own input {
  background: var(--night-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 12px;
  font-variant-numeric: tabular-nums;
}

/* ---------- Ticket ---------- */
.ticket-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.ticket {
  background: var(--butter);
  color: var(--ink);
  border-radius: 18px;
  transform: rotate(-1.2deg);
  transform-origin: 50% 0;
  box-shadow: 0 24px 50px -22px rgba(0, 0, 0, .7);
}
.ticket.bump { animation: bump .35s ease-out; }
@keyframes bump {
  40% { transform: rotate(-1.2deg) scale(1.025); }
}
.ticket-main { padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 16px; }
.ticket-brand {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}
.ticket-title {
  font-family: var(--display);
  font-size: 2.25rem;
  line-height: 1;
  margin: 0;
}
.ticket dl { margin: 0; display: flex; flex-direction: column; gap: 12px; }
.ticket dt {
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: .62;
}
.ticket dd { margin: 2px 0 0; font-weight: 600; font-size: 1.0625rem; overflow-wrap: anywhere; }
.ticket dd ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.ticket dd.empty { font-weight: 400; opacity: .6; }
.ticket-when { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
.ticket-when dd { font-variant-numeric: tabular-nums; }

.tear {
  position: relative;
  height: 0;
  border-top: 2px dashed rgba(42, 19, 32, .45);
  margin: 0 18px;
}
.tear::before, .tear::after {
  content: "";
  position: absolute;
  top: -12px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--night);
}
.tear::before { left: -29px; }
.tear::after { right: -29px; }

.ticket-stub {
  padding: 16px 22px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.stub-text { font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.stub-text b { display: block; font-family: var(--display); font-weight: 400; font-size: var(--fs-lg); letter-spacing: 0; text-transform: none; }
.barcode {
  width: 112px;
  height: 40px;
  flex: none;
  background: repeating-linear-gradient(90deg,
    var(--ink) 0 2px, transparent 2px 5px,
    var(--ink) 5px 6px, transparent 6px 8px,
    var(--ink) 8px 11px, transparent 11px 13px,
    var(--ink) 13px 14px, transparent 14px 18px);
}

.send { display: flex; flex-direction: column; gap: 10px; }
.btn {
  border: 0;
  border-radius: 999px;
  padding: 14px 22px;
  font-weight: 700;
  background: var(--coral);
  color: var(--ink);
  transition: transform .12s, filter .12s;
}
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn.secondary { background: transparent; color: var(--blush); border: 1px solid var(--line); }
.btn.secondary:hover { border-color: var(--blush); filter: none; }
.status { min-height: 1.4em; margin: 0; font-size: var(--fs-sm); color: var(--butter); }
.msg-wrap { display: flex; flex-direction: column; gap: 6px; }
.msg-wrap label { font-size: var(--fs-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
#msg {
  width: 100%;
  min-height: 132px;
  resize: vertical;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: var(--fs-sm);
  color: var(--muted);
}

/* ---------- Phone: jump bar ---------- */
.jump {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--butter);
  color: var(--ink);
  border: 0;
  border-radius: 999px;
  padding: 12px 20px;
  font-weight: 700;
  font-size: var(--fs-sm);
  box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .8);
  transition: transform .2s, opacity .2s;
}
.jump span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.jump span:last-child { flex: none; }
.jump.hidden { transform: translateY(140%); opacity: 0; pointer-events: none; }
@media (min-width: 940px) { .jump { display: none; } }

@media (max-width: 420px) {
  .page { padding: 20px 16px 110px; }
  .ideas { grid-template-columns: 1fr; }
  .idea { min-height: 0; }
  .day { border-radius: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="page">

  <header class="hero">
    <p class="brand">Афиша свиданий</p>
    <h1>Куда пойдём<span>?</span></h1>
    <p>Выбери до трёх идей, день и время. Из этого соберётся билет — отправь его мне, и свидание назначено.</p>
  </header>

  <div class="layout">
    <main class="programme">

      <section class="step" aria-labelledby="h-what">
        <div class="step-head">
          <span class="step-num" aria-hidden="true">1</span>
          <h2 id="h-what">Что делаем</h2>
          <p class="step-hint" id="pick-count" aria-live="polite">выбрано 0 из 3</p>
        </div>
        <div class="chips" id="filters" role="group" aria-label="Где проводим время"></div>
        <div class="ideas" id="ideas"></div>
        <div class="row">
          <button type="button" class="ghost" id="random">Не могу решить, выбери за меня</button>
          <div class="field">
            <label for="custom">Или свой вариант</label>
            <input id="custom" type="text" maxlength="80" placeholder="Например: едем кататься на лошадях" autocomplete="off">
          </div>
        </div>
      </section>

      <section class="step" aria-labelledby="h-when">
        <div class="step-head">
          <span class="step-num" aria-hidden="true">2</span>
          <h2 id="h-when">Когда</h2>
          <p class="step-hint" id="range"></p>
        </div>
        <div class="days" id="days" role="group" aria-label="День"></div>
        <div class="row">
          <div class="chips" id="times" role="group" aria-label="Время"></div>
          <label class="time-own" for="time-own">своё время
            <input id="time-own" type="time">
          </label>
        </div>
      </section>

      <section class="step" aria-labelledby="h-sign">
        <div class="step-head">
          <span class="step-num" aria-hidden="true">3</span>
          <h2 id="h-sign">Подпись</h2>
        </div>
        <div class="row" style="align-items:flex-start">
          <div class="field">
            <label for="name">От кого</label>
            <input id="name" type="text" maxlength="40" placeholder="Твоё имя" autocomplete="given-name">
          </div>
          <div class="field" style="flex-basis:320px">
            <label for="note">Пожелание</label>
            <textarea id="note" maxlength="200" placeholder="Например: без опозданий и с цветами"></textarea>
          </div>
        </div>
      </section>

    </main>

    <aside class="ticket-col" id="ticket-col" aria-label="Билет">
      <div class="ticket" id="ticket">
        <div class="ticket-main">
          <div class="ticket-brand"><span>Афиша свиданий</span><span id="t-serial">№ 0000</span></div>
          <p class="ticket-title">Билет на&nbsp;свидание</p>
          <dl>
            <div>
              <dt>Что</dt>
              <dd id="t-what" class="empty">Выбери идею из афиши</dd>
            </div>
            <div class="ticket-when">
              <div><dt>Когда</dt><dd id="t-day"></dd></div>
              <div><dt>Во сколько</dt><dd id="t-time"></dd></div>
            </div>
            <div id="t-note-row" hidden>
              <dt>Пожелание</dt>
              <dd id="t-note"></dd>
            </div>
          </dl>
        </div>
        <div class="tear" aria-hidden="true"></div>
        <div class="ticket-stub">
          <div class="stub-text">Вход на двоих<b id="t-name">от меня</b></div>
          <div class="barcode" aria-hidden="true"></div>
        </div>
      </div>

      <div class="send">
        <button type="button" class="btn" id="copy">Скопировать ответ</button>
        <button type="button" class="btn secondary" id="share" hidden>Отправить в мессенджер</button>
        <p class="status" id="status" role="status"></p>
      </div>
      <div class="msg-wrap">
        <label for="msg">Текст, который уйдёт</label>
        <textarea id="msg" readonly></textarea>
      </div>
    </aside>
  </div>
</div>

<button type="button" class="jump" id="jump"><span id="jump-text">Билет пока пустой</span><span>к билету ↓</span></button>

<script>
(function () {
  "use strict";

  /* ===== Варианты свиданий. Чтобы добавить свой, допиши строку в этот список. ===== */
  var IDEAS = [
    { cat: "home",   title: "Киновечер под пледом",      text: "Один фильм выбираешь ты, второй я. Попкорн обязателен.",            time: "3 часа",     cost: "почти даром" },
    { cat: "home",   title: "Готовим ужин вдвоём",        text: "Паста, музыка и один фартук на двоих. Посуду моет проигравший.",   time: "2 часа",     cost: "недорого" },
    { cat: "home",   title: "Вечер настолок",             text: "Играем на желания. Желания пишем заранее и прячем в банку.",        time: "2 часа",     cost: "бесплатно" },
    { cat: "home",   title: "Завтрак в постель",          text: "Блинчики, кофе и никаких будильников. Телефоны остаются на кухне.", time: "всё утро",   cost: "почти даром" },
    { cat: "city",   title: "Ужин в новом месте",         text: "Ресторан, где мы оба ещё не были. Десерт берём один на двоих.",     time: "2 часа",     cost: "щедро" },
    { cat: "city",   title: "Кофе и долгая прогулка",     text: "Берём кофе с собой и идём, куда ноги ведут. Маршрут не строим.",    time: "2 часа",     cost: "почти даром" },
    { cat: "city",   title: "Кино на большом экране",     text: "Последний ряд, большой попкорн, обсуждение фильма по дороге домой.", time: "3 часа",     cost: "недорого" },
    { cat: "city",   title: "Выставка или музей",         text: "Ходим медленно, спорим о картинах, выбираем по одной любимой.",     time: "2 часа",     cost: "недорого" },
    { cat: "city",   title: "Бар с коктейлями",           text: "Заказываем друг другу коктейль вслепую и угадываем состав.",        time: "вечер",      cost: "средне" },
    { cat: "active", title: "Каток",                      text: "Держимся за руки по уважительной причине. После — горячий какао.",  time: "2 часа",     cost: "недорого" },
    { cat: "active", title: "Боулинг",                    text: "Три партии. Проигравший угощает ужином.",                           time: "2 часа",     cost: "средне" },
    { cat: "active", title: "Урок танцев",                text: "Сальса или бачата для начинающих. Наступать на ноги разрешено.",    time: "1,5 часа",   cost: "средне" },
    { cat: "active", title: "Велопрогулка",               text: "Берём велосипеды в прокат и едем вдоль набережной до заката.",      time: "3 часа",     cost: "недорого" },
    { cat: "nature", title: "Пикник в парке",             text: "Плед, сыр, фрукты и что-нибудь почитать друг другу вслух.",         time: "полдня",     cost: "недорого" },
    { cat: "nature", title: "Встретить закат",            text: "Крыша, набережная или холм. Термос с чаем беру я.",                 time: "1,5 часа",   cost: "бесплатно" },
    { cat: "nature", title: "День за городом",            text: "Садимся в электричку и выходим там, где красиво.",                  time: "весь день",  cost: "средне" },
    { cat: "nature", title: "Звёзды и костёр",            text: "Уезжаем подальше от фонарей, жарим зефир и ищем созвездия.",        time: "вечер и ночь", cost: "недорого" }
  ];
  var CATS = [
    { id: "all",    name: "Все" },
    { id: "home",   name: "Дома" },
    { id: "city",   name: "В городе" },
    { id: "active", name: "Активно" },
    { id: "nature", name: "На природе" }
  ];
  var TIMES = ["12:00", "15:00", "18:00", "19:00", "20:00", "21:00"];
  var MAX_PICKS = 3;
  var DAYS_AHEAD = 14;
  var STORE_KEY = "date-afisha-v1";

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  var catName = function (id) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i].name;
    return "";
  };

  /* ----- dates ----- */
  function dayKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function fromKey(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var days = [];
  for (var i = 0; i < DAYS_AHEAD; i++) {
    days.push(new Date(today.getFullYear(), today.getMonth(), today.getDate() + i));
  }
  var fmtWd = new Intl.DateTimeFormat("ru-RU", { weekday: "short" });
  var fmtLong = new Intl.DateTimeFormat("ru-RU", { weekday: "long", day: "numeric", month: "long" });
  var fmtDM = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long" });

  function defaultDay() {
    for (var i = 0; i < days.length; i++) if (days[i].getDay() === 6) return dayKey(days[i]);
    return dayKey(days[0]);
  }

  /* ----- state ----- */
  var state = { picks: [], custom: "", day: defaultDay(), time: "19:00", name: "", note: "", filter: "all" };

  function restore(saved) {
    if (!saved || typeof saved !== "object") return;
    if (Array.isArray(saved.picks)) {
      state.picks = saved.picks.filter(function (n) { return Number.isInteger(n) && n >= 0 && n < IDEAS.length; }).slice(0, MAX_PICKS);
    }
    ["custom", "name", "note"].forEach(function (k) { if (typeof saved[k] === "string") state[k] = saved[k]; });
    if (typeof saved.time === "string" && /^\d\d:\d\d$/.test(saved.time)) state.time = saved.time;
    if (typeof saved.day === "string" && days.some(function (d) { return dayKey(d) === saved.day; })) state.day = saved.day;
    if (typeof saved.filter === "string" && catName(saved.filter)) state.filter = saved.filter;
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage may be unavailable */ }
  }

  /* ----- derived text ----- */
  function pickedTitles() {
    var list = state.picks.map(function (i) { return IDEAS[i].title; });
    var own = state.custom.trim();
    if (own) list.push(own);
    return list;
  }
  function dayText() { return fmtLong.format(fromKey(state.day)); }
  function serial() {
    var d = fromKey(state.day);
    return "№ " + pad(d.getDate()) + pad(d.getMonth() + 1) + "-" + state.time.replace(":", "");
  }
  function message() {
    var titles = pickedTitles();
    var lines = ["Билет на свидание " + serial()];
    if (titles.length === 1) {
      lines.push("Что: " + titles[0]);
    } else if (titles.length > 1) {
      lines.push("Что (любое из):");
      titles.forEach(function (t) { lines.push("• " + t); });
    } else {
      lines.push("Что: на твой выбор");
    }
    lines.push("Когда: " + dayText() + ", в " + state.time);
    if (state.note.trim()) lines.push("Пожелание: " + state.note.trim());
    if (state.name.trim()) lines.push("От: " + state.name.trim());
    return lines.join("\n");
  }

  /* ----- render ----- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderFilters() {
    var box = $("filters"); box.textContent = "";
    CATS.forEach(function (c) {
      var b = el("button", "chip", c.name);
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.filter === c.id));
      b.addEventListener("click", function () { state.filter = c.id; renderFilters(); renderIdeas(); save(); });
      box.appendChild(b);
    });
  }

  function renderIdeas() {
    var box = $("ideas"); box.textContent = "";
    var full = state.picks.length >= MAX_PICKS;
    IDEAS.forEach(function (idea, i) {
      if (state.filter !== "all" && idea.cat !== state.filter) return;
      var on = state.picks.indexOf(i) !== -1;
      var b = el("button", "idea");
      b.type = "button";
      b.setAttribute("aria-pressed", String(on));
      if (full && !on) b.setAttribute("aria-disabled", "true");
      var top = el("span", "idea-top");
      top.appendChild(el("span", null, "№ " + pad(i + 1) + " · " + catName(idea.cat)));
      top.appendChild(el("span", "idea-pick"));
      b.appendChild(top);
      b.appendChild(el("span", "idea-title", idea.title));
      b.appendChild(el("span", "idea-text", idea.text));
      b.appendChild(el("span", "idea-meta", idea.time + " · " + idea.cost));
      b.addEventListener("click", function () { toggle(i); });
      box.appendChild(b);
    });
    $("pick-count").textContent = full
      ? "выбрано 3 из 3, сними одну, чтобы поменять"
      : "выбрано " + state.picks.length + " из " + MAX_PICKS;
  }

  function renderDays() {
    var box = $("days"); box.textContent = "";
    days.forEach(function (d) {
      var key = dayKey(d);
      var b = el("button", "day" + (d.getDay() === 0 || d.getDay() === 6 ? " weekend" : ""));
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.day === key));
      b.setAttribute("aria-label", fmtLong.format(d));
      b.appendChild(el("span", "day-wd", fmtWd.format(d)));
      b.appendChild(el("span", "day-n", String(d.getDate())));
      b.addEventListener("click", function () { state.day = key; renderDays(); renderTicket(true); save(); });
      box.appendChild(b);
    });
    $("range").textContent = fmtDM.format(days[0]) + " – " + fmtDM.format(days[days.length - 1]);
  }

  function renderTimes() {
    var box = $("times"); box.textContent = "";
    TIMES.forEach(function (t) {
      var b = el("button", "chip", t);
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.time === t));
      b.addEventListener("click", function () { state.time = t; renderTimes(); renderTicket(true); save(); });
      box.appendChild(b);
    });
    $("time-own").value = state.time;
  }

  var bumpTimer = null;
  function renderTicket(bump) {
    var titles = pickedTitles();
    var what = $("t-what");
    what.textContent = "";
    if (titles.length) {
      what.className = "";
      var ul = el("ul");
      titles.forEach(function (t) { ul.appendChild(el("li", null, t)); });
      what.appendChild(ul);
    } else {
      what.className = "empty";
      what.textContent = "Выбери идею из афиши";
    }
    $("t-day").textContent = dayText();
    $("t-time").textContent = state.time;
    $("t-serial").textContent = serial();
    $("t-name").textContent = state.name.trim() ? "от " + state.name.trim() : "от меня";
    $("t-note-row").hidden = !state.note.trim();
    $("t-note").textContent = state.note.trim();
    $("msg").value = message();
    $("status").textContent = "";
    $("jump-text").textContent = titles.length
      ? titles.length + " " + (titles.length === 1 ? "идея" : "идеи") + " · " + fmtDM.format(fromKey(state.day)) + ", " + state.time
      : "Билет пока пустой";
    if (bump) {
      var t = $("ticket");
      t.classList.remove("bump");
      void t.offsetWidth;
      t.classList.add("bump");
      clearTimeout(bumpTimer);
      bumpTimer = setTimeout(function () { t.classList.remove("bump"); }, 400);
    }
  }

  /* ----- actions ----- */
  function toggle(i) {
    var at = state.picks.indexOf(i);
    if (at !== -1) state.picks.splice(at, 1);
    else if (state.picks.length < MAX_PICKS) state.picks.push(i);
    else return;
    renderIdeas(); renderTicket(true); save();
  }

  $("random").addEventListener("click", function () {
    var pool = [];
    IDEAS.forEach(function (idea, i) {
      if (state.filter === "all" || idea.cat === state.filter) pool.push(i);
    });
    var next = pool[Math.floor(Math.random() * pool.length)];
    if (pool.length > 1) while (state.picks.length === 1 && next === state.picks[0]) {
      next = pool[Math.floor(Math.random() * pool.length)];
    }
    state.picks = [next];
    renderIdeas(); renderTicket(true); save();
  });

  [["custom", "custom"], ["name", "name"], ["note", "note"]].forEach(function (pair) {
    $(pair[0]).addEventListener("input", function (e) { state[pair[1]] = e.target.value; renderTicket(false); save(); });
  });
  $("time-own").addEventListener("change", function (e) {
    if (/^\d\d:\d\d$/.test(e.target.value)) { state.time = e.target.value; renderTimes(); renderTicket(true); save(); }
  });

  function selectMessage() {
    var m = $("msg");
    m.focus(); m.select();
  }
  $("copy").addEventListener("click", function () {
    var text = message();
    var ok = function () { $("status").textContent = "Скопировано. Вставь в чат и отправь."; };
    var fail = function () {
      selectMessage();
      var done = false;
      try { done = document.execCommand("copy"); } catch (e) { done = false; }
      $("status").textContent = done ? "Скопировано. Вставь в чат и отправь." : "Текст выделен ниже. Скопируй его вручную.";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fail);
    } else {
      fail();
    }
  });

  var inFrame = false;
  try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  if (navigator.share && !inFrame) {
    $("share").hidden = false;
    $("share").addEventListener("click", function () {
      navigator.share({ text: message() }).catch(function (err) {
        if (err && err.name !== "AbortError") $("status").textContent = "Не получилось открыть мессенджер. Скопируй ответ кнопкой выше.";
      });
    });
  }

  $("jump").addEventListener("click", function () {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    $("ticket-col").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  });
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      $("jump").classList.toggle("hidden", entries[0].isIntersecting);
    }, { threshold: 0.15 }).observe($("ticket"));
  }

  /* ----- boot ----- */
  function start(snapshot) {
    var saved = null;
    if (snapshot && Object.keys(snapshot).length) saved = snapshot;
    else { try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { saved = null; } }
    restore(saved);
    $("custom").value = state.custom;
    $("name").value = state.name;
    $("note").value = state.note;
    renderFilters(); renderIdeas(); renderDays(); renderTimes(); renderTicket(false);
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return state; });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
